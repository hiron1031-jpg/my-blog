<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:670px; }
  body {
    font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
    width:1280px; height:670px; overflow:hidden;
    background: linear-gradient(135deg, #E8551B 0%, #B03806 100%);
    position:relative; color:#fff;
    display:flex; flex-direction:column; justify-content:center;
    padding: 0 62px;
  }
  .deco { position:absolute; inset:0; opacity:0.07;
    background: repeating-linear-gradient(60deg, #fff 0 3px, transparent 3px 42px); }
  .badge-top {
    display:inline-block; background:#F6C445; color:#B03806;
    font-weight:900; font-size:32px; letter-spacing:0.04em;
    padding:10px 28px; border-radius:999px; margin-bottom:20px; width:fit-content;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .title { font-weight:900; line-height:1.1; letter-spacing:0.01em;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.18); }
  .title .l1 { font-size:50px; }
  .title .l2 { font-size:96px; margin-top:4px; }
  .title .l2 em { font-style:normal; color:#FFD873; }
  .items { margin-top:30px; display:flex; gap:14px; flex-wrap:wrap; }
  .items span {
    background:rgba(255,255,255,0.14); border:2px solid rgba(255,255,255,0.4);
    border-radius:12px; padding:12px 20px; font-size:27px; font-weight:700;
  }
  .pages {
    position:absolute; right:56px; bottom:52px;
    background:#fff; color:#B03806; border-radius:16px;
    padding:18px 28px; text-align:center; box-shadow:0 8px 18px rgba(0,0,0,0.22);
    transform: rotate(4deg);
  }
  .pages .n { font-size:56px; font-weight:900; line-height:1; }
  .pages .n small { font-size:26px; }
  .pages .cap { font-size:21px; color:#666; margin-top:6px; font-weight:700; }
</style>
</head>
<body>
  <div class="deco"></div>
  <div class="badge-top">パック限定 ／ 令和8年度 第二次検定</div>
  <div class="title">
    <div class="l1">1級土木施工管理技士</div>
    <div class="l2">直前<em>総仕上げ</em>キット</div>
  </div>
  <div class="items">
    <span>頻出語句・数値 暗記シート</span>
    <span>8週間プランナー</span>
    <span>減点NG総まとめ</span>
  </div>
  <div class="pages">
    <div class="n">PDF<small>2本</small></div>
    <div class="cap">全15ページ</div>
  </div>
</body>
</html>
